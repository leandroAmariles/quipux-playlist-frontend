name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/leandroamariles/quipux-playlist-frontend:${{ needs.release-please.outputs.version }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - run: >-
          docker build --platform linux/amd64
          --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
          --label "org.opencontainers.image.version=${VERSION}"
          --label "org.opencontainers.image.revision=$(git rev-parse HEAD)"
          --tag "${IMAGE}" .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - run: echo "${REGISTRY_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "${IMAGE}"

  update-infra:
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      GH_TOKEN: ${{ secrets.INFRA_PR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: leandroAmariles/quipux-playlist-infra
          ref: main
          token: ${{ secrets.INFRA_PR_TOKEN }}
          persist-credentials: true
      - run: |
          cd k8s
          kustomize edit set image "ghcr.io/leandroamariles/quipux-playlist-frontend=ghcr.io/leandroamariles/quipux-playlist-frontend:${VERSION}"
          cd ..
          if git diff --quiet k8s/kustomization.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/deploy-frontend"
          git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" || true
          git checkout -B "${BRANCH}"
          git add k8s/kustomization.yaml
          git commit -m "chore(deploy): bump frontend image to ${VERSION}"
          git push --force-with-lease origin "${BRANCH}"
          if [ -n "$(gh pr list --repo leandroAmariles/quipux-playlist-infra --head "${BRANCH}" --state open --json number --jq '.[0].number')" ]; then
            gh pr edit "${BRANCH}" --repo leandroAmariles/quipux-playlist-infra --title "chore(deploy): bump frontend image to ${VERSION}" --body "Update frontend image tag to ${VERSION}."
          else
            gh pr create --repo leandroAmariles/quipux-playlist-infra --base main --head "${BRANCH}" --title "chore(deploy): bump frontend image to ${VERSION}" --body "Update frontend image tag to ${VERSION}."
          fi
